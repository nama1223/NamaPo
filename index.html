<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NamaTempoTrainer</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1E1A28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NamaPo">
<link rel="apple-touch-icon" href="./NamaPo192.png">
<style>
  :root{
    --bg:#1E1A28;
    --bg-elevated:#2B2438;
    --bg-elevated-2:#362C48;
    --border:#453A5C;
    --text:#F4EEDF;
    --text-muted:#B3A7C9;
    --accent:#D6A54C;
    --accent-soft:#4A3B22;
    --correct-bg:#6FBF97;
    --correct-text:#0F2419;
    --incorrect-bg:#E2897B;
    --incorrect-text:#3B140D;
    --near-bg:#7FB8E0;
    --near-text:#0A2740;
    --focus-ring:#8FD3FF;
    --danger:#E2897B;
    --font-display: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", "Noto Sans Mono", monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Segoe UI", Roboto, sans-serif;
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:22px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html[data-theme="light"]{
    --bg:#F5F0E6;
    --bg-elevated:#FFFFFF;
    --bg-elevated-2:#ECE4D3;
    --border:#D8CBB0;
    --text:#241C14;
    --text-muted:#6B5F4E;
    --accent:#B9791F;
    --accent-soft:#F0DFB8;
    --correct-bg:#B7E2C9;
    --correct-text:#113822;
    --incorrect-bg:#F3C3B9;
    --incorrect-text:#5A1D12;
    --near-bg:#BFE0F5;
    --near-text:#0F3A5C;
    --focus-ring:#2E6F9E;
  }
  html.flash-active{ filter:invert(1); }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  button, input, select{
    font-family:inherit;
    color:inherit;
  }
  button{
    cursor:pointer;
    border:none;
    background:none;
    -webkit-appearance:none;
    appearance:none;
  }
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:3px solid var(--focus-ring);
    outline-offset:2px;
  }
  #app{
    max-width:480px;
    min-height:100%;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }
  /* ---------- header ---------- */
  #app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(10px + var(--safe-top)) 16px 10px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:10;
  }
  #app-header .brand{
    display:flex;
    align-items:center;
    gap:8px;
  }
  #app-header .brand-name{
    font-weight:700;
    font-size:14px;
    letter-spacing:0.03em;
    color:var(--text-muted);
  }
  .pendulum{
    width:20px;
    height:24px;
    position:relative;
    flex-shrink:0;
  }
  .pendulum-base{
    position:absolute;
    left:2px;
    right:2px;
    bottom:2px;
    height:2px;
    border-radius:1px;
    background:var(--border);
  }
  .pendulum-arm{
    position:absolute;
    left:50%;
    bottom:2px;
    width:2px;
    height:18px;
    border-radius:1px;
    background:var(--accent);
    transform-origin:50% 100%;
    transform:translateX(-50%) rotate(0deg);
    will-change:transform;
  }
  .pendulum-arm::after{
    content:'';
    position:absolute;
    top:-3px;
    left:50%;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    transform:translateX(-50%);
  }
  #btn-lang{
    padding:6px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    color:var(--text);
    background:var(--bg-elevated);
  }
  /* ---------- main / screens ---------- */
  #app-main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .screen{
    display:none;
    flex-direction:column;
    flex:1;
    padding:20px 16px calc(20px + var(--safe-bottom));
    gap:18px;
    position:relative;
  }
  .screen.active{
    display:flex;
  }
  /* ---------- top screen ---------- */
  #screen-top{
    justify-content:flex-start;
    align-items:stretch;
    padding-top:6vh;
    gap:0;
  }
  .title-block{
    text-align:center;
    margin-bottom:4vh;
  }
  .title-en{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .title-ja{
    margin-top:6px;
    font-size:15px;
    color:var(--text-muted);
    letter-spacing:0.3em;
  }
  .brand-nama{ color:#72F3F8; }
  .brand-po{ color:#FFB9B7; }
  .top-menu{
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .category-block{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
  }
  .category-title{
    font-size:13px;
    font-weight:700;
    color:var(--text-muted);
    letter-spacing:0.05em;
    padding-left:2px;
  }
  .submode-selector{
    display:flex;
    background:var(--bg-elevated-2);
    border-radius:999px;
    padding:3px;
    gap:2px;
    margin-bottom:2px;
  }
  .submode-selector button{
    flex:1;
    padding:9px 4px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    color:var(--text-muted);
    text-align:center;
  }
  .submode-selector button.active{
    background:var(--accent);
    color:var(--correct-text);
  }
  .menu-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    font-size:16px;
    font-weight:600;
    text-align:left;
  }
  .menu-btn .menu-icon{
    font-family:var(--font-display);
    font-size:18px;
    color:var(--accent);
    width:28px;
    text-align:center;
    flex-shrink:0;
  }
  .menu-btn.primary{
    background:var(--accent-soft);
    border-color:var(--accent);
  }
  .menu-btn.secondary{
    padding:12px 18px;
    font-size:14px;
    font-weight:500;
    color:var(--text-muted);
    margin-bottom:10px;
  }
  .top-menu .divider{
    height:1px;
    background:var(--border);
    margin:6px 0 16px;
  }
  /* ---------- common mode header ---------- */
  .mode-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .mode-title{
    font-size:17px;
    font-weight:700;
  }
  .streak-badge{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    background:var(--bg-elevated);
    border-radius:999px;
    font-size:13px;
    color:var(--text-muted);
  }
  .streak-badge .streak-value{
    font-family:var(--font-display);
    font-weight:700;
    color:var(--accent);
    font-size:15px;
  }
  .streak-badge .points-inline{
    font-family:var(--font-display);
    font-weight:700;
    color:var(--accent);
  }
  .streak-badge .question-num-inline{
    font-family:var(--font-display);
    font-weight:700;
    color:var(--text);
  }
  .streak-badge .badge-sep{
    opacity:0.5;
  }
  .points-fly{
    position:absolute;
    left:8%;
    bottom:32%;
    font-family:var(--font-display);
    font-weight:800;
    font-size:26px;
    white-space:nowrap;
    pointer-events:none;
    z-index:60;
    animation:points-fly-anim 1.6s linear forwards;
  }
  .points-fly.judgment-correct{ color:var(--correct-bg); }
  .points-fly.judgment-near{ color:var(--near-bg); }
  .points-fly.judgment-wrong{ color:var(--incorrect-bg); }
  @keyframes points-fly-anim{
    0%{ opacity:0; left:8%; bottom:30%; transform:scale(0.8); }
    12.5%{ opacity:1; left:22.4%; bottom:39.2%; transform:scale(1.1); }
    31.25%{ left:36.8%; bottom:48.4%; transform:scale(1); }
    68.75%{ left:51.2%; bottom:57.6%; transform:scale(1); }
    87.5%{ left:65.6%; bottom:66.8%; transform:scale(1); }
    92%{ opacity:1; left:70.8%; bottom:70.1%; transform:scale(1); }
    100%{ opacity:0; left:80%; bottom:76%; transform:scale(0.95); }
  }
  .reroll-row{
    display:flex;
    justify-content:center;
    gap:10px;
  }
  .btn-reroll{
    padding:9px 16px;
    border:1px solid var(--border);
    border-radius:999px;
    font-size:13px;
    color:var(--text-muted);
    background:var(--bg-elevated);
  }
  .btn-open-presets{
    padding:9px 16px;
    border:1px solid var(--accent);
    border-radius:999px;
    font-size:13px;
    color:var(--accent);
    background:var(--bg-elevated);
  }
  [data-submode="survival"] .reroll-row,
  [data-submode="challenge60"] .reroll-row{ display:none; }
  .mode-prompt{
    text-align:center;
    font-size:14px;
    font-weight:600;
    color:var(--text);
    padding:0 6px;
  }
  /* ---------- life display (survival) ---------- */
  .life-display{
    display:none;
    justify-content:center;
    gap:4px;
    font-size:22px;
    min-height:26px;
  }
  [data-submode="survival"] .life-display{ display:flex; }
  .life-heart{ display:inline-block; }
  .life-heart.life-lost{
    animation:lifeFall 0.5s ease-in forwards;
  }
  @keyframes lifeFall{
    0%{ transform:translateY(0); opacity:1; }
    70%{ transform:translateY(28px); opacity:0.9; }
    100%{ transform:translateY(46px); opacity:0; }
  }
  .life-fly{
    position:absolute;
    left:50%;
    top:52%;
    font-size:26px;
    transform:translate(-50%,-50%) scale(0.4);
    opacity:0;
    pointer-events:none;
    z-index:5;
  }
  .life-fly.fly-active{
    animation:lifeFly 2s ease-out forwards;
  }
  @keyframes lifeFly{
    0%{ transform:translate(-50%,-50%) scale(0.4); opacity:0; }
    15%{ opacity:1; transform:translate(-50%,-74%) scale(1.1); }
    40%{ transform:translate(-68%,-190%) scale(1); }
    60%{ transform:translate(-32%,-300%) scale(0.95); }
    85%{ transform:translate(-50%,-400%) scale(0.8); opacity:1; }
    100%{ transform:translate(-50%,-450%) scale(0.5); opacity:0; }
  }
  /* ---------- 60s challenge ---------- */
  .challenge-prestart{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:26px 14px;
    background:var(--bg-elevated);
    border-radius:var(--radius-l);
    border:1px solid var(--border);
  }
  [data-uistate="prestart"] .challenge-prestart{ display:flex; }
  .challenge-prestart-text{
    text-align:center;
    font-size:15px;
    font-weight:600;
    line-height:1.5;
  }
  .btn-challenge-start{
    padding:14px 34px;
    border-radius:999px;
    background:var(--accent);
    color:var(--correct-text);
    font-size:16px;
    font-weight:700;
  }
  .challenge-timer{
    display:none;
    text-align:center;
    font-family:var(--font-display);
    font-size:34px;
    font-weight:700;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  [data-submode="challenge60"][data-uistate="playing"] .challenge-timer{ display:block; }
  /* ---------- game result panel (survival gameover / challenge timeup) ---------- */
  .game-result-panel{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:22px 12px;
    background:var(--bg-elevated);
    border-radius:var(--radius-l);
    border:1px solid var(--border);
  }
  [data-uistate="gameover"] .game-result-panel,
  [data-uistate="timeup"] .game-result-panel{ display:flex; }
  .result-title{ font-size:18px; font-weight:700; }
  .result-stats{ font-family:var(--font-display); font-size:15px; color:var(--text-muted); }
  /* ---------- hide groups by uistate ---------- */
  [data-uistate="prestart"] .play-wrap,
  [data-uistate="prestart"] .mode-prompt,
  [data-uistate="prestart"] .choice-grid,
  [data-uistate="prestart"] .input-row,
  [data-uistate="gameover"] .play-wrap,
  [data-uistate="gameover"] .mode-prompt,
  [data-uistate="gameover"] .choice-grid,
  [data-uistate="gameover"] .input-row,
  [data-uistate="gameover"] .reveal-box,
  [data-uistate="timeup"] .play-wrap,
  [data-uistate="timeup"] .mode-prompt,
  [data-uistate="timeup"] .choice-grid,
  [data-uistate="timeup"] .input-row,
  [data-uistate="timeup"] .reveal-box{ display:none !important; }
  [data-submode="challenge60"][data-uistate="playing"] .play-btn,
  [data-submode="challenge60"][data-uistate="playing"] .play-caption{ display:none; }
  /* ---------- play button / beat ring ---------- */
  .play-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:14px 0 4px;
  }
  .play-ring{
    position:relative;
    width:118px;
    height:118px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .play-ring .pulse-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid var(--accent);
    opacity:0;
  }
  .play-ring .pulse-ring.beat{
    animation:pulseBeat 0.42s ease-out;
  }
  @keyframes pulseBeat{
    0%{ transform:scale(0.86); opacity:0.9; }
    100%{ transform:scale(1.28); opacity:0; }
  }
  .play-btn{
    position:relative;
    z-index:1;
    width:96px;
    height:96px;
    border-radius:50%;
    background:var(--accent);
    color:var(--correct-text);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0;
  }
  .play-btn svg{ width:34px; height:34px; }
  .play-caption{
    font-size:13px;
    color:var(--text-muted);
  }
  /* ---------- choice grid (mode 1) ---------- */
  .choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .choice-btn{
    padding:22px 8px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    text-align:center;
  }
  .choice-btn .num{
    font-family:var(--font-display);
    font-size:30px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .choice-btn .unit{
    display:block;
    margin-top:2px;
    font-size:11px;
    color:var(--text-muted);
  }
  .choice-btn.is-correct{
    background:var(--correct-bg);
    border-color:var(--correct-bg);
  }
  .choice-btn.is-correct .num, .choice-btn.is-correct .unit{ color:var(--correct-text); }
  .choice-btn.is-incorrect{
    background:var(--incorrect-bg);
    border-color:var(--incorrect-bg);
  }
  .choice-btn.is-incorrect .num, .choice-btn.is-incorrect .unit{ color:var(--incorrect-text); }
  .choice-btn.is-near{
    background:var(--near-bg);
    border-color:var(--near-bg);
  }
  .choice-btn.is-near .num, .choice-btn.is-near .unit{ color:var(--near-text); }
  .choice-btn:disabled{ opacity:1; }
  /* ---------- input mode ---------- */
  .input-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  #input-tempo{
    width:160px;
    padding:14px 10px;
    text-align:center;
    font-family:var(--font-display);
    font-size:34px;
    font-weight:700;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
  }
  #input-tempo::-webkit-outer-spin-button,
  #input-tempo::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .btn-answer{
    width:100%;
    padding:16px;
    border-radius:var(--radius-m);
    font-size:16px;
    font-weight:700;
    background:var(--accent);
    color:var(--correct-text);
  }
  .btn-answer:disabled{
    background:var(--bg-elevated-2);
    color:var(--text-muted);
  }
  .btn-answer.is-correct{ background:var(--correct-bg); color:var(--correct-text); }
  .btn-answer.is-incorrect{ background:var(--incorrect-bg); color:var(--incorrect-text); }
  .btn-answer.is-near{ background:var(--near-bg); color:var(--near-text); }
  /* ---------- reveal area ---------- */
  .reveal-box{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:18px 10px;
    background:var(--bg-elevated);
    border-radius:var(--radius-l);
    border:1px solid var(--border);
  }
  .reveal-box.show{ display:flex; }
  .reveal-label{
    font-size:14px;
    color:var(--text-muted);
  }
  .reveal-value{
    font-family:var(--font-display);
    font-size:38px;
    font-weight:700;
    color:var(--accent);
  }
  .reveal-actions{
    display:flex;
    gap:10px;
    width:100%;
  }
  .reveal-actions button{
    flex:1;
    padding:13px 6px;
    border-radius:var(--radius-m);
    font-size:14px;
    font-weight:600;
  }
  .btn-next{
    background:var(--accent);
    color:var(--correct-text);
  }
  /* ---------- tap-based modes (mode3 自力タップ / mode4 テンポキープ) ---------- */
  .target-display{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:14px 0 2px;
  }
  .target-display .reveal-label{
    font-size:13px;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .target-display .big-num{
    font-family:var(--font-display);
    font-size:44px;
    font-weight:700;
    color:var(--accent);
  }
  .target-display .big-num.tap-editable{
    cursor:pointer;
    display:inline-block;
    border-bottom:2px dashed var(--border);
    padding-bottom:2px;
  }
  .target-display .big-num .target-edit-input{
    font-family:var(--font-display);
    font-size:44px;
    font-weight:700;
    color:var(--accent);
    background:var(--bg-elevated-2);
    border:2px solid var(--accent);
    border-radius:var(--radius-s);
    width:4.2em;
    text-align:center;
  }
  .measures-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .measures-row .row-label{ font-size:14px; font-weight:600; }
  .measures-row input[type="number"]{
    width:70px;
    padding:8px 6px;
    text-align:center;
    font-family:var(--font-display);
    font-size:18px;
    font-weight:700;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:var(--radius-s);
    touch-action:pan-x;
    cursor:ns-resize;
    transition:border-color 0.2s, background-color 0.2s;
  }
  .measures-row input[type="number"].touch-active{
    border-color:var(--accent);
    background-color:var(--bg-elevated-2);
  }
  .tap-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .tk-action-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .btn-tap-action{
    width:100%;
    padding:26px 10px;
    border-radius:var(--radius-l);
    background:var(--bg-elevated);
    border:2px solid var(--accent);
    font-size:18px;
    font-weight:700;
    transition:transform 0.08s ease;
  }
  .btn-tap-action.tk-tall{
    padding:52px 10px;
  }
  .btn-tap-action:disabled{ opacity:0.45; }
  .btn-tap-action.tapped{
    transform:scale(0.96);
    background:var(--accent-soft);
  }
  .btn-tap-action.beat{
    animation:actionBeatPulse 0.42s ease-out;
  }
  @keyframes actionBeatPulse{
    0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }

var STORAGE_KEY_HISTORY = 'namatempotrainer_history_v1';
var STORAGE_KEY_SETTINGS = 'namatempotrainer_settings_v1';

function saveHistoryToStorage(){
  try {
    localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(state.history));
  } catch (e){ /* ストレージ不可の環境では何もしない */ }
}

/* 旧バージョン(v1.1)の選択/入力モード履歴(1問=1件)を、新しいセッション集計形式に変換する */
function migrateHistoryEntry(entry){
  if ((entry.type === 'select' || entry.type === 'input') && entry.details === undefined){
    return {
      id: entry.id,
      type: entry.type,
      subMode: 'unlimited',
      timestamp: entry.timestamp,
      correctCount: entry.correct ? 1 : 0,
      incorrectCount: entry.correct ? 0 : 1,
      details: [{ correct: entry.correct, targetTempo: entry.targetTempo, userTempo: entry.userTempo, timestamp: entry.timestamp }]
    };
  }
  return entry;
}

function loadHistoryFromStorage(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY_HISTORY);
    if (raw){
      var parsed = JSON.parse(raw);
      state.history = parsed.map(migrateHistoryEntry);
      saveHistoryToStorage();
    }
  } catch (e){ /* ストレージ不可、または壊れたデータは無視 */ }
}

function saveSettingsToStorage(){
  try {
    localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(state.settings));

}

function loadSettingsFromStorage(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY_SETTINGS);
    if (raw){
      var loaded = JSON.parse(raw);
      for (var key in loaded){
        if (Object.prototype.hasOwnProperty.call(state.settings, key)){
          state.settings[key] = loaded[key];
        }
      }
    }
  } catch (e){ /* ストレージ不可、または壊れたデータは無視 */ }
}

function loadTempoListFromStorage(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY_TEMPOLIST);
    if (raw){
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)){
        var cleaned = parsed.filter(function(v){ return typeof v === 'number' && isFinite(v) && v >= 20 && v <= 400; });
        cleaned = cleaned.filter(function(v, i){ return cleaned.indexOf(v) === i; });
        cleaned.sort(function(a, b){ return a - b; });
        if (cleaned.length >= MIN_TEMPO_LIST_LENGTH) TEMPO_LIST = cleaned;
      }
    }
  } catch (e){ /* ストレージ不可、または壊れたデータは無視 */ }
}

}

/* ==================================================================

   ================================================================== */
function t(key){
  var dict = I18N[state.lang];
  return (dict && dict[key] !== undefined) ? dict[key] : key;
}

function pickRandomTempo(exclude){
  var candidates = TEMPO_LIST;
  if (exclude !== undefined && exclude !== null){
    candidates = TEMPO_LIST.filter(function(v){ return v !== exclude; });
  }
  var idx = Math.floor(Math.random() * candidates.length);
  return candidates[idx];
}

function shuffleArray(arr){
  for (var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function formatTempo(n){
  return '\u2669=' + n;
}

/* ---- 採点判定 (◯正解 / △隣接 / ✕それ以外) ---- */
function getTempoNeighborBounds(tempo){
  var idx = TEMPO_LIST.indexOf(tempo);
  return {
    lower: idx > 0 ? TEMPO_LIST[idx - 1] : null,
    upper: (idx >= 0 && idx < TEMPO_LIST.length - 1) ? TEMPO_LIST[idx + 1] : null
  };
}

function judgeAnswer(target, value){
  if (value === target) return 'correct';
  var bounds = getTempoNeighborBounds(target);
  if (bounds.lower !== null && value >= bounds.lower && value < target) return 'near';
  if (bounds.upper !== null && value <= bounds.upper && value > target) return 'near';
  return 'wrong';
}

function judgmentClass(judgment){
  return judgment === 'correct' ? 'is-correct' : (judgment === 'near' ? 'is-near' : 'is-incorrect');
}

/* タップでトレーニング系(自力タップ/テンポキープ/妨害)共通: お題を手動値で開始し直す */
function commitManualTempo(type, value){
  if (type === 'tap') startTapRound(value);
  else if (type === 'tempokeep') startTempoKeepRound(value);
  else if (type === 'obstruct') startObstructRound(value);
}

/* HTMLへの埋め込み用に最低限のエスケープを行う(課題名はユーザーが自由に入力する文字列のため) */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(ch){
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}

/* ---- 課題テンポ(プリセット)のCRUD ---- */
function addPreset(name, tempo){
  var trimmed = (name || '').trim();
  if (!trimmed) return { ok: false, reason: 'name' };
  if (isNaN(tempo) || tempo < 20 || tempo > 400) return { ok: false, reason: 'range' };
  tempoPresets.push({ id: 'p' + Date.now() + Math.floor(Math.random() * 1000), name: trimmed, tempo: Math.round(tempo) });
  savePresetsToStorage();
  return { ok: true };
}

function renamePreset(id, newName){
  var trimmed = (newName || '').trim();
  if (!trimmed) return { ok: false };
  var p = tempoPresets.filter(function(x){ return x.id === id; })[0];
  if (!p) return { ok: false };
  p.name = trimmed;
  savePresetsToStorage();
  return { ok: true };
}

function duplicatePreset(id){
  var idx = -1;
  for (var i = 0; i < tempoPresets.length; i++){
    if (tempoPresets[i].id === id){ idx = i; break; }
  }
  if (idx === -1) return;
  var p = tempoPresets[idx];
  var copy = { id: 'p' + Date.now() + Math.floor(Math.random() * 1000), name: p.name + t('presetCopySuffix'), tempo: p.tempo };
  tempoPresets.splice(idx + 1, 0, copy);
  savePresetsToStorage();
}

function deletePreset(id){
  tempoPresets = tempoPresets.filter(function(x){ return x.id !== id; });
  savePresetsToStorage();
}

function reorderPreset(fromIndex, toIndex){
  if (fromIndex === toIndex) return;
  var item = tempoPresets.splice(fromIndex, 1)[0];
  tempoPresets.splice(toIndex, 0, item);
  savePresetsToStorage();
}

function getFilteredSortedPresets(){
  var list = tempoPresets.slice();
  var q = presetsModalState.query.trim().toLowerCase();
  if (q){
    list = list.filter(function(p){ return p.name.toLowerCase().indexOf(q) !== -1; });
  }
  if (presetsModalState.sortKey){
    var key = presetsModalState.sortKey;
    list.sort(function(a, b){
      var av = key === 'name' ? a.name.toLowerCase() : a.tempo;
      var bv = key === 'name' ? b.name.toLowerCase() : b.tempo;
      if (av < bv) return -1;
      if (av > bv) return 1;
      return 0;
    });
    if (presetsModalState.sortDir === 'desc') list.reverse();
  }
  return list;
}

/* ドラッグハンドルでの並べ替え。HTML5 Drag and Dropはタッチ環境で不安定なため、
   pointerイベントで座標を追いながら手動でドロップ先を判定する */
function startPresetDrag(evt, row, p, listEl){
  evt.preventDefault();
  var startIndex = findPresetIndexById(p.id);
  if (startIndex === -1) return;
  row.classList.add('dragging');
  var pointerId = evt.pointerId;

  function hitTestRow(clientY){
    var rows = qsa(listEl, '.preset-row');
    for (var i = 0; i < rows.length; i++){
      var rect = rows[i].getBoundingClientRect();
      if (clientY >= rect.top && clientY <= rect.bottom) return rows[i];
    }
    return null;
  }

  function onMove(mvEvt){
    if (mvEvt.pointerId !== pointerId) return;
    mvEvt.preventDefault();
    qsa(listEl, '.preset-row').forEach(function(r){ r.classList.remove('drag-over'); });
    var target = hitTestRow(mvEvt.clientY);
    if (target && target !== row) target.classList.add('drag-over');
  }

  function onUp(upEvt){
    if (upEvt.pointerId !== pointerId) return;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    row.classList.remove('dragging');
    qsa(listEl, '.preset-row').forEach(function(r){ r.classList.remove('drag-over'); });
    var target = hitTestRow(upEvt.clientY);
    if (target && target !== row){
      var toIndex = findPresetIndexById(target.getAttribute('data-preset-id'));
      if (toIndex !== -1){
        reorderPreset(startIndex, toIndex);
        renderPresetsList();
      }
    }
  }

  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

/* ホイール／縦スワイプで値を上下操作する共通ユーティリティ(scroll-and-swipe-spec.md準拠)。
   移動量(またはホイール量)を貯めて閾値を超えたら1段階だけ動かし、その時点で基準点をリセットする。
   これにより「一定量スワイプ／スクロールするたびにカチッと1段階動く」操作感になり、連続的な変動を防ぐ。
   el   : 対象のDOM要素
   actUp: 上方向(値を増やす等)の操作を実行する関数
   actDn: 下方向(値を減らす等)の操作を実行する関数
   sens : 感度の倍率(大きいほど「重く」＝多く動かさないと反応しない。既定1) */
function bindScrollSwipe(el, actUp, actDn, sens){
  if (!el) return;
  sens = sens || 1;
  var wAcc = 0, tY = 0, swipeLocked = false;

  function doUp(){ actUp(); playScrollSwipeTick(); }
  function doDn(){ actDn(); playScrollSwipeTick(); }

  /* ホイール操作 */
  el.addEventListener('wheel', function(evt){
    evt.preventDefault(); /* ページスクロールを即座にブロック */
    wAcc += evt.deltaY;
    var threshold = 50 * sens;
    if (wAcc > threshold){ doDn(); wAcc = 0; }
    else if (wAcc < -threshold){ doUp(); wAcc = 0; }
  }, { passive: false });

  /* タッチスワイプ操作 */
  el.addEventListener('touchstart', function(evt){
    if (evt.target.tagName === 'SELECT' || (evt.target.closest && evt.target.closest('select'))){
      swipeLocked = true;
      return;
    }
    swipeLocked = false;
    tY = evt.touches[0].clientY;
    el.classList.add('touch-active'); /* 操作中である見た目のフィードバック */
  }, { passive: true });

  el.addEventListener('touchmove', function(evt){
    if (swipeLocked) return;
    var cY = evt.touches[0].clientY;
    var diff = tY - cY; /* 上スワイプで正の値 */
    var threshold = 20 * sens;
    if (Math.abs(diff) > threshold){
      if (diff > 0) doUp(); else doDn();
      tY = cY; /* 基準点を更新(連続的な変動を防ぎ、1段階ずつ発火させる) */
      if (evt.cancelable) evt.preventDefault(); /* ブラウザのスクロール／pull-to-refreshを阻止 */
    }
  }, { passive: false });

  el.addEventListener('touchend', function(){
    el.classList.remove('touch-active');
    swipeLocked = false;
  });
}

/* スクロール＆スワイプ操作が1段階動くたびに鳴らす短い操作音 */
function playScrollSwipeTick(){
  var ctx = ensureAudioContext();
  var t0 = ctx.currentTime;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(900, t0);
  osc.connect(gain).connect(ctx.destination);
  gain.gain.setValueAtTime(0.12 * state.settings.clickVolume + 0.001, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
  osc.start(t0);
  osc.stop(t0 + 0.06);
  trackNode(osc);
}

/* 「小節数」入力欄の増減 */
function adjustMeasures(type, delta){

  var min = parseInt(input.min, 10);
  var max = parseInt(input.max, 10);
  var v = parseInt(input.value, 10);
  if (isNaN(v)) v = min;
  v = Math.max(min, Math.min(max, v + delta));
  input.value = v;
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

/* 履歴1件(またはセッション進行中)の◯△✕件数とポイントを取得。
   新形式はセッション側で集計済みの値をそのまま使い、旧形式はdetails(またはcorrectCount/incorrectCount)から復元する */
function getEntryStats(entry){
  if (typeof entry.points === 'number' && typeof entry.oCount === 'number'){
    return { o: entry.oCount, near: entry.nearCount || 0, x: entry.xCount || 0, points: entry.points };
  }
  var o = 0, near = 0, x = 0;
  if (entry.details && entry.details.length){
    entry.details.forEach(function(d){
      if (d.kind === 'lifegain') return;
      var j = d.judgment || (d.correct === true ? 'correct' : (d.correct === false ? 'wrong' : null));
      if (j === 'correct') o++;
      else if (j === 'near') near++;
      else if (j === 'wrong') x++;
    });
  } else {
    o = entry.correctCount || 0;
    x = entry.incorrectCount || 0;
  }
  var points = o * POINTS.correct + near * POINTS.near + x * POINTS.wrong;
  return { o: o, near: near, x: x, points: points };
}

function judgmentPercents(stats){
  var total = stats.o + stats.near + stats.x;
  return {
    total: total,
    pctStrict: total > 0 ? Math.round((stats.o / total) * 100) : 0,
    pctLenient: total > 0 ? Math.round(((stats.o + stats.near) / total) * 100) : 0
  };
}

function buildJudgmentSummaryHtml(stats){
  var pct = judgmentPercents(stats);
  return '<span class="count-points">' + stats.points + 'P</span>' +
    '<span class="count-o">\u25cb' + stats.o + '</span>' +
    '<span class="count-near">\u25b3' + stats.near + '</span>' +
    '<span class="count-x">\u2715' + stats.x + '</span>' +
    '<span class="count-percent">' + pct.pctStrict + '%/' + pct.pctLenient + '%</span>';
}

  if (TEMPO_LIST.indexOf(value) !== -1) return { ok: false, reason: 'dup' };
  TEMPO_LIST = TEMPO_LIST.concat([value]).sort(function(a, b){ return a - b; });

}

  if (TEMPO_LIST.length <= MIN_TEMPO_LIST_LENGTH) return { ok: false, reason: 'min' };
  TEMPO_LIST = TEMPO_LIST.filter(function(v){ return v !== value; });

}

/* 妨害モード: お題テンポの隣接テンポ範囲内(お題±2は除く)からランダムに1つ選ぶ。
   範囲が定義できない場合(隣接テンポが無いなど)はお題から十分離れた値にフォールバックする */
function pickDistractorTempo(target){
  var bounds = getTempoNeighborBounds(target);
  var ranges = [];
  if (bounds.lower !== null){
    var lowHigh = target - 3;
    if (lowHigh >= bounds.lower) ranges.push([bounds.lower, lowHigh]);
  }
  if (bounds.upper !== null){
    var highLow = target + 3;
    if (highLow <= bounds.upper) ranges.push([highLow, bounds.upper]);
  }
  if (ranges.length === 0){
    var fallbackLow = Math.max(20, target - 30);
    var fallbackHigh = Math.min(400, target + 30);
    var v;
    do { v = fallbackLow + Math.floor(Math.random() * (fallbackHigh - fallbackLow + 1)); } while (Math.abs(v - target) < 3);
    return v;
  }
  var totalWidth = ranges.reduce(function(sum, r){ return sum + (r[1] - r[0] + 1); }, 0);
  var pick = Math.floor(Math.random() * totalWidth);
  for (var i = 0; i < ranges.length; i++){
    var width = ranges[i][1] - ranges[i][0] + 1;
    if (pick < width) return ranges[i][0] + pick;
    pick -= width;
  }
  return ranges[0][0];
}

   ================================================================== */
function startNewSession(type, subMode){
  commitCurrentSession();
  currentSession = {
    id: 'h' + Date.now() + Math.floor(Math.random() * 1000),
    type: type,
    subMode: subMode,
    timestamp: Date.now(),
    oCount: 0,
    nearCount: 0,
    xCount: 0,
    points: 0,
    details: []
  };
}

function commitCurrentSession(){
  if (!currentSession) return;
  if (currentSession.details.length === 0){ currentSession = null; return; }
  state.history.push(currentSession);
  saveHistoryToStorage();
  currentSession = null;
}

function recordSessionDetail(type, detail){
  if (!currentSession) return;
  currentSession.details.push(detail);
  if (detail.judgment === 'correct'){ currentSession.oCount++; currentSession.points += POINTS.correct; }
  else if (detail.judgment === 'near'){ currentSession.nearCount++; currentSession.points += POINTS.near; }
  else if (detail.judgment === 'wrong'){ currentSession.xCount++; currentSession.points += POINTS.wrong; }
}

/* ==================================================================
   オーディオエンジン
   ================================================================== */
function ensureAudioContext(){
  if (!state.audioCtx){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    state.audioCtx = new Ctx();
  }
  if (state.audioCtx.state === 'suspended'){
    state.audioCtx.resume();
  }
  return state.audioCtx;
}

function trackNode(node){
  state.activeAudioNodes.push(node);
  node.onended = function(){
    var i = state.activeAudioNodes.indexOf(node);
    if (i >= 0) state.activeAudioNodes.splice(i, 1);
  };
}

function stopAllScheduledAudio(){
  state.activeAudioNodes.forEach(function(node){
    try { node.stop(); } catch(e){ /* already stopped */ }
  });
  state.activeAudioNodes = [];
  cancelPendingBeatEffects();
}

function scheduleClick(ctx, time, opts){
  opts = opts || {};
  var accent = !!opts.accent;
  var volume = (opts.volume === undefined) ? state.settings.clickVolume : opts.volume;
  var timbre = opts.timbre || state.settings.clickSound;
  var gain = ctx.createGain();
  gain.connect(ctx.destination);
  var peak = (accent ? 1.0 : 0.82) * volume;

  if (timbre === 'wood'){
    var dur = 0.055;
    var bufferSize = Math.floor(ctx.sampleRate * dur);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++){
      var decay = Math.pow(1 - i / bufferSize, 3);
      data[i] = (Math.random() * 2 - 1) * decay;
    }
    var src = ctx.createBufferSource();
    src.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = accent ? 2400 : 1700;
    filter.Q.value = 2.4;
    src.connect(filter).connect(gain);
    gain.gain.setValueAtTime(peak, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
    src.start(time);
    src.stop(time + dur);
    trackNode(src);
  } else {
    var osc = ctx.createOscillator();
    osc.type = (timbre === 'beep') ? 'square' : 'sine';
    osc.frequency.value = accent ? 1600 : (timbre === 'beep' ? 900 : 1100);
    osc.connect(gain);
    gain.gain.setValueAtTime(peak, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.045);
    osc.start(time);
    osc.stop(time + 0.05);
    trackNode(osc);
  }
}

/* 正解/不正解の効果音 (60秒チャレンジ用) */
function playCorrectSfx(){
  var ctx = ensureAudioContext();
  var t0 = ctx.currentTime;
  /* C6-E6-G6-B6-E7 の5音アルペジオ。各音に1オクターブ上の倍音を薄く重ねて華やかさを出す */
  [1046.5, 1318.5, 1568, 1975.5, 2637].forEach(function(freq, i){
    var start = t0 + i * 0.06;

    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.connect(gain).connect(ctx.destination);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.5 * state.settings.clickVolume + 0.001, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.32);
    osc.start(start);
    osc.stop(start + 0.34);
    trackNode(osc);

    var oscHi = ctx.createOscillator();
    var gainHi = ctx.createGain();
    oscHi.type = 'sine';
    oscHi.frequency.value = freq * 2;
    oscHi.connect(gainHi).connect(ctx.destination);
    gainHi.gain.setValueAtTime(0.0001, start);
    gainHi.gain.exponentialRampToValueAtTime(0.18 * state.settings.clickVolume + 0.0005, start + 0.01);
    gainHi.gain.exponentialRampToValueAtTime(0.0001, start + 0.24);
    oscHi.start(start);
    oscHi.stop(start + 0.26);
    trackNode(oscHi);
  });
}

function playIncorrectSfx(){
  var ctx = ensureAudioContext();
  var t0 = ctx.currentTime;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, t0);
  osc.frequency.exponentialRampToValueAtTime(90, t0 + 0.28);
  osc.connect(gain).connect(ctx.destination);
  gain.gain.setValueAtTime(0.35 * state.settings.clickVolume + 0.001, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
  osc.start(t0);
  osc.stop(t0 + 0.3);
  trackNode(osc);
}

/* △(隣接テンポ)用のフィードバック音: 従来◯で使っていた2音構成をそのまま転用 */
function playNearSfx(){
  var ctx = ensureAudioContext();
  var t0 = ctx.currentTime;
  [1568, 2093].forEach(function(freq, i){
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.connect(gain).connect(ctx.destination);
    var start = t0 + i * 0.07;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.5 * state.settings.clickVolume + 0.001, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.18);
    osc.start(start);
    osc.stop(start + 0.2);
    trackNode(osc);
  });
}

/* ---- フラッシュ / バイブ (音を出せない環境向けのビート通知) ---- */
function triggerFlash(){
  var html = document.documentElement;
  html.classList.remove('flash-active');
  void html.offsetWidth;
  html.classList.add('flash-active');
  setTimeout(function(){ html.classList.remove('flash-active'); }, 100);
}

function triggerVibrate(){
  if (navigator.vibrate){
    try { navigator.vibrate(80); } catch(e){ /* 非対応環境は無視 */ }
  }
}

/* 予約済みのビート演出を追跡し、まとめてキャンセルできるようにする。
   これがないと、音声を停止してもフラッシュ/バイブ/パルスだけ予約通り発火し続けてしまう。
   setTimeoutではなくAudioContextの時刻(audioCtx.currentTime)をrequestAnimationFrameで
   継続的に監視して発火させる方式。setTimeoutはメインスレッドの混雑や省電力機能の影響で
   ずれが生じやすいが、audioCtx.currentTimeは音声ハードウェアの時計を基準にしており、
   これをrAF(画面更新のたびに実行される)で監視することで、setTimeoutの遅延に振り回されず
   音とのズレを画面更新間隔(端末により異なるが概ね16〜17ms程度)まで抑えられる */
var pendingBeatEffects = [];
var beatEffectsRafId = null;

/* アプリが主導する拍(自動再生)にビジュアル/フラッシュ/バイブを同期させる。
   targetCtxTimeはaudioCtx.currentTimeと同じ時間軸の絶対時刻(秒)で指定する */
function scheduleBeatEffects(targetCtxTime, pulseEl){
  pendingBeatEffects.push({ targetTime: targetCtxTime, pulseEl: pulseEl });
  if (beatEffectsRafId === null){
    beatEffectsRafId = requestAnimationFrame(beatEffectsTick);
  }
}

function beatEffectsTick(){
  var ctx = state.audioCtx;
  var now = ctx ? ctx.currentTime : 0;
  for (var i = pendingBeatEffects.length - 1; i >= 0; i--){
    if (now >= pendingBeatEffects[i].targetTime){
      fireBeatEffect(pendingBeatEffects[i].pulseEl);
      pendingBeatEffects.splice(i, 1);
    }
  }
  if (pendingBeatEffects.length > 0){
    beatEffectsRafId = requestAnimationFrame(beatEffectsTick);
  } else {
    beatEffectsRafId = null;
  }
}

function fireBeatEffect(pulseEl){
  if (pulseEl){
    pulseEl.classList.remove('beat');
    void pulseEl.offsetWidth;
    pulseEl.classList.add('beat');
  }
  if (state.settings.flash) triggerFlash();
  if (state.settings.vibrate) triggerVibrate();
}

function cancelPendingBeatEffects(){
  pendingBeatEffects = [];
  if (beatEffectsRafId !== null){ cancelAnimationFrame(beatEffectsRafId); beatEffectsRafId = null; }
  document.documentElement.classList.remove('flash-active');
}

function playTempoPreview(tempo, screenEl){
  stopAllScheduledAudio();
  var ctx = ensureAudioContext();
  var startDelay = 0.08;
  var interval = 60 / tempo;
  var startTime = ctx.currentTime + startDelay;
  var pulseEl = screenEl ? qs(screenEl, '[data-pulse]') : null;
  for (var i = 0; i < 8; i++){
    var tm = startTime + i * interval;
    scheduleClick(ctx, tm, { accent: i === 0 });
    scheduleBeatEffects(tm, pulseEl);
  }
}

/* ---- 連続再生スケジューラ (60秒チャレンジ) ---- */
function startContinuousPlayback(tempo, pulseEl){
  stopContinuousPlayback();
  var ctx = ensureAudioContext();
  continuousPlayback.active = true;
  continuousPlayback.interval = 60 / tempo;
  continuousPlayback.ctxTime = ctx.currentTime + 0.05;
  continuousPlayback.pulseEl = pulseEl || null;
  scheduleContinuousBatch();
}

function scheduleContinuousBatch(){
  if (!continuousPlayback.active) return;
  var ctx = state.audioCtx;
  var batchSize = 4;
  for (var i = 0; i < batchSize; i++){
    var tm = continuousPlayback.ctxTime + i * continuousPlayback.interval;
    scheduleClick(ctx, tm, { accent: false });
    scheduleBeatEffects(tm, continuousPlayback.pulseEl);
  }
  var batchDurationMs = batchSize * continuousPlayback.interval * 1000;
  continuousPlayback.ctxTime += batchSize * continuousPlayback.interval;
  continuousPlayback.batchTimeoutId = setTimeout(scheduleContinuousBatch, Math.max(50, batchDurationMs - 150));
}

function stopContinuousPlayback(){
  continuousPlayback.active = false;
  if (continuousPlayback.batchTimeoutId){
    clearTimeout(continuousPlayback.batchTimeoutId);
    continuousPlayback.batchTimeoutId = null;
  }
  stopAllScheduledAudio();
}

/* ==================================================================
   設定画面: テスト再生 (8拍再生 / もう一度押すと停止)
   ================================================================== */
var TEST_PLAY_TEMPO = 120;

function toggleTestPlay(){
  var btn = document.getElementById('btn-test-play');
  if (state.testPlaying){
    stopAllScheduledAudio();
    if (state.testPlayTimeoutId){
      clearTimeout(state.testPlayTimeoutId);
      state.testPlayTimeoutId = null;
    }
    state.testPlaying = false;
    renderTestPlayButton(btn);
    return;
  }
  stopAllScheduledAudio();
  var ctx = ensureAudioContext();
  var startDelay = 0.08;
  var interval = 60 / TEST_PLAY_TEMPO;
  var startTime = ctx.currentTime + startDelay;
  for (var i = 0; i < 8; i++){
    var tm = startTime + i * interval;
    scheduleClick(ctx, tm, { accent: i === 0 });
    scheduleBeatEffects(tm, null);
  }
  state.testPlaying = true;
  renderTestPlayButton(btn);
  var totalMs = (startDelay + 8 * interval) * 1000 + 60;
  state.testPlayTimeoutId = setTimeout(function(){
    state.testPlaying = false;
    state.testPlayTimeoutId = null;
    renderTestPlayButton(document.getElementById('btn-test-play'));
  }, totalMs);
}

function renderTestPlayButton(btn){
  if (!btn) return;
  btn.textContent = state.testPlaying ? t('btnTestStop') : t('btnTestPlay');
  btn.classList.toggle('is-playing', state.testPlaying);
}

/* ==================================================================
   選択肢生成 (モード1)
   ================================================================== */
function buildChoices(correctTempo){
  var correctIndex = TEMPO_LIST.indexOf(correctTempo);
  var windowSize = DIFFICULTY_WINDOW[state.settings.difficulty] || 3;
  var lo, hi, candidates, expand;

  expand = windowSize;
  do {
    lo = Math.max(0, correctIndex - expand);
    hi = Math.min(TEMPO_LIST.length - 1, correctIndex + expand);
    candidates = [];
    for (var i = lo; i <= hi; i++){
      if (i !== correctIndex) candidates.push(i);
    }
    expand++;
  } while (candidates.length < 3 && (lo > 0 || hi < TEMPO_LIST.length - 1));

  shuffleArray(candidates);
  var pickedIdx = candidates.slice(0, 3);
  var values = pickedIdx.map(function(i){ return TEMPO_LIST[i]; });
  values.push(correctTempo);
  shuffleArray(values);
  return values;
}

/* ==================================================================
   モード1・2 共通進行ロジック (無制限 / 生き残り)
   ================================================================== */
function startRound(type){
  stopAllScheduledAudio();
  var rs = roundState[type];
  rs.tempo = pickRandomTempo(rs.tempo);
  rs.uiState = 'ready';
  if (type === 'select'){
    rs.choices = buildChoices(rs.tempo);
  }
  renderModeScreen(type);
}

function rerollRound(type){
  startRound(type);
}

function renderModeScreen(type){
  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  var rs = roundState[type];

  screenEl.setAttribute('data-submode', state.listenSubMode);
  screenEl.setAttribute('data-uistate', rs.uiState);

  qs(screenEl, '[data-streak-value]').textContent = rs.streak;
  qs(screenEl, '[data-question-num]').textContent = formatQuestionNumber(rs.questionNumber);
  qs(screenEl, '[data-points-value]').textContent = (currentSession ? currentSession.points : 0) + 'P';
  qs(screenEl, '[data-reveal]').classList.remove('show');

  if (state.listenSubMode === 'survival'){
    renderLifeDisplay(type);
  }

  if (type === 'select'){
    var grid = qs(screenEl, '[data-choice-grid]');
    grid.innerHTML = '';
    rs.choices.forEach(function(val){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn';
      btn.setAttribute('data-value', val);
      btn.innerHTML = '<span class="num">' + val + '</span><span class="unit">BPM</span>';
      btn.addEventListener('click', function(){
        onSelectAnswer(parseInt(this.getAttribute('data-value'), 10), this);
      });
      grid.appendChild(btn);
    });
  } else {
    var input = qs(screenEl, '#input-tempo');
    input.value = '';
    input.disabled = false;
    var answerBtn = qs(screenEl, '.btn-answer');
    answerBtn.disabled = true;
    answerBtn.classList.remove('is-correct', 'is-incorrect');
  }
}

function onSelectAnswer(value, btnEl){
  var rs = roundState.select;
  var judgment = judgeAnswer(rs.tempo, value);
  if (state.listenSubMode === 'challenge60'){
    handleChallengeAnswer('select', judgment, value, btnEl);
    return;
  }
  if (rs.uiState !== 'ready') return;
  btnEl.classList.add(judgmentClass(judgment));
  qsa(btnEl.parentElement, '.choice-btn').forEach(function(b){ b.disabled = true; });
  handleUnlimitedOrSurvivalAnswer('select', judgment, value);
}

function onInputAnswer(){
  var rs = roundState.input;
  var screenEl = document.getElementById('screen-mode2');
  var input = qs(screenEl, '#input-tempo');
  var value = parseInt(input.value, 10);
  if (isNaN(value)) return;
  var judgment = judgeAnswer(rs.tempo, value);

  if (state.listenSubMode === 'challenge60'){
    handleChallengeAnswer('input', judgment, value, null);
    return;
  }
  if (rs.uiState !== 'ready') return;

  var answerBtn = qs(screenEl, '.btn-answer');
  answerBtn.classList.add(judgmentClass(judgment));
  input.disabled = true;
  handleUnlimitedOrSurvivalAnswer('input', judgment, value);
}

function handleUnlimitedOrSurvivalAnswer(type, judgment, value){
  var rs = roundState[type];
  var isSurvival = (state.listenSubMode === 'survival');
  var isWrong = (judgment === 'wrong');

  stopAllScheduledAudio();
  if (judgment === 'correct'){ playCorrectSfx(); }
  else if (judgment === 'near'){ playNearSfx(); }
  else { playIncorrectSfx(); }

  rs.streak = isWrong ? 0 : rs.streak + 1;

  if (isSurvival && isWrong){
    rs.lives = Math.max(0, rs.lives - 1);
  }

  var detail = { judgment: judgment, targetTempo: rs.tempo, userTempo: value, timestamp: Date.now() };
  if (isSurvival) detail.livesAfter = rs.lives;
  recordSessionDetail(type, detail);
  spawnPointsFly(type, judgment, POINTS[judgment]);
  updatePointsBadge(type);

  var gainedLife = false;
  if (isSurvival && !isWrong && rs.streak > 0 && rs.streak % 5 === 0){
    rs.lives += 1;
    gainedLife = true;
    recordSessionDetail(type, { kind: 'lifegain', livesAfter: rs.lives, timestamp: Date.now() });
  }

  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  qs(screenEl, '[data-streak-value]').textContent = rs.streak;

  if (isSurvival){
    if (gainedLife){ triggerLifeGainAnimation(type); }
    else if (isWrong){ triggerLifeLossAnimation(type); }
    else { renderLifeDisplay(type); }
  }

  if (isSurvival && rs.lives <= 0){
    if (isWrong){
      /* 最後のハートが落ちる演出を見せてからゲームオーバー画面に切り替える */
      setTimeout(function(){ endSurvival(type); }, 520);
    } else {
      endSurvival(type);
    }
    return;
  }

  rs.uiState = 'revealed';
  screenEl.setAttribute('data-uistate', 'revealed');
  renderRevealText(modeScreenId(type));
}

function renderRevealText(screenName){
  var screenEl = document.getElementById('screen-' + screenName);
  var revealBox = qs(screenEl, '[data-reveal]');
  var type = screenName === 'mode1' ? 'select' : 'input';
  var tempo = roundState[type].tempo;
  qs(revealBox, '[data-reveal-value]').textContent = formatTempo(tempo);
  revealBox.classList.add('show');
}

/* ---- 生き残りモード: ライフ表示・アニメーション・終了処理 ---- */
function renderLifeDisplay(type){
  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  var el = qs(screenEl, '[data-life-display]');
  if (!el) return;
  var rs = roundState[type];
  el.innerHTML = '';
  if (rs.lives <= 0){
    el.textContent = '\u2013';
    return;
  }
  for (var i = 0; i < rs.lives; i++){
    var heart = document.createElement('span');
    heart.className = 'life-heart';
    heart.textContent = '\u2764';
    el.appendChild(heart);
  }
}

function triggerLifeGainAnimation(type){
  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  var flying = document.createElement('span');
  flying.className = 'life-fly';
  flying.textContent = '\u2764';
  screenEl.appendChild(flying);
  requestAnimationFrame(function(){ flying.classList.add('fly-active'); });
  setTimeout(function(){
    flying.remove();
    renderLifeDisplay(type);
  }, 2000);
}

/* ライフを失った瞬間、消える対象のハートをその場から真下に落として消す */
function triggerLifeLossAnimation(type){
  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  var el = qs(screenEl, '[data-life-display]');
  if (!el){ renderLifeDisplay(type); return; }
  var hearts = qsa(el, '.life-heart');
  var target = hearts[hearts.length - 1]; /* 減る前の一番右のハートが消える対象 */
  if (!target){ renderLifeDisplay(type); return; }
  target.classList.add('life-lost');
  setTimeout(function(){ renderLifeDisplay(type); }, 500);
}

function endSurvival(type){
  stopAllScheduledAudio();
  var rs = roundState[type];
  rs.uiState = 'gameover';
  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  screenEl.setAttribute('data-uistate', 'gameover');
  qs(screenEl, '[data-reveal]').classList.remove('show');
  renderResultPanel(type, 'gameover');
  commitCurrentSession();
}

function renderResultPanel(type, kind){
  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  var titleEl = qs(screenEl, '[data-result-title]');
  var statsEl = qs(screenEl, '[data-result-stats]');
  var stats = currentSession ? getEntryStats(currentSession) : { o: 0, near: 0, x: 0, points: 0 };
  titleEl.textContent = (kind === 'gameover') ? t('resultGameOver') : t('resultTimeUp');
  statsEl.innerHTML = buildJudgmentSummaryHtml(stats);
}

/* ---- 60秒チャレンジ ---- */
function startChallenge60(type){
  var rs = roundState[type];
  rs.uiState = 'playing';
  rs.tempo = pickRandomTempo(rs.tempo);
  if (type === 'select') rs.choices = buildChoices(rs.tempo);

  challenge60.active = true;
  challenge60.endTime = performance.now() + 60000;

  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  screenEl.setAttribute('data-uistate', 'playing');
  renderModeScreen(type);

  var pulseEl = qs(screenEl, '[data-pulse]');
  startContinuousPlayback(rs.tempo, pulseEl);

  challenge60.tickIntervalId = setInterval(function(){ updateChallengeTimer(type); }, 31);
  updateChallengeTimer(type);
}

function updateChallengeTimer(type){
  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  var el = qs(screenEl, '[data-challenge-timer]');
  var remaining = challenge60.endTime - performance.now();
  if (remaining <= 0){
    if (el) el.textContent = '0.000';
    endChallenge60(type);
    return;
  }
  if (el) el.textContent = (remaining / 1000).toFixed(3);
}

function handleChallengeAnswer(type, judgment, value, btnEl){
  var rs = roundState[type];
  if (rs.uiState !== 'playing') return;
  stopContinuousPlayback();

  rs.streak = (judgment === 'wrong') ? 0 : rs.streak + 1;

  if (judgment === 'correct'){ playCorrectSfx(); }
  else if (judgment === 'near'){ playNearSfx(); }
  else { playIncorrectSfx(); }

  var remainingMs = Math.max(0, challenge60.endTime - performance.now());
  recordSessionDetail(type, { judgment: judgment, targetTempo: rs.tempo, userTempo: value, timeRemainingMs: Math.round(remainingMs), timestamp: Date.now() });
  spawnPointsFly(type, judgment, POINTS[judgment]);
  updatePointsBadge(type);

  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  if (type === 'select'){
    qsa(screenEl, '.choice-btn').forEach(function(b){
      b.disabled = true;
      if (judgment !== 'correct' && parseInt(b.getAttribute('data-value'), 10) === rs.tempo){
        b.classList.add('is-correct');
      }
    });
    if (btnEl) btnEl.classList.add(judgmentClass(judgment));
  } else {
    qs(screenEl, '.btn-answer').classList.add(judgmentClass(judgment));
    qs(screenEl, '#input-tempo').disabled = true;
  }

  setTimeout(function(){
    if (remainingMs <= 0 || challenge60.endTime - performance.now() <= 0){
      endChallenge60(type);
    } else {
      advanceChallengeQuestion(type);
    }
  }, 300);
}

function advanceChallengeQuestion(type){
  var rs = roundState[type];
  if (rs.uiState !== 'playing') return;
  rs.questionNumber++;
  rs.tempo = pickRandomTempo(rs.tempo);
  if (type === 'select') rs.choices = buildChoices(rs.tempo);
  renderModeScreen(type);
  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  var pulseEl = qs(screenEl, '[data-pulse]');
  startContinuousPlayback(rs.tempo, pulseEl);
}

function endChallenge60(type){
  var rs = roundState[type];
  if (rs.uiState === 'timeup') return;
  stopContinuousPlayback();
  if (challenge60.tickIntervalId){ clearInterval(challenge60.tickIntervalId); challenge60.tickIntervalId = null; }
  challenge60.active = false;
  rs.uiState = 'timeup';
  var screenEl = document.getElementById('screen-' + modeScreenId(type));
  screenEl.setAttribute('data-uistate', 'timeup');
  renderResultPanel(type, 'timeup');
  commitCurrentSession();
}

function renderTapScreen(){

  qs(screenEl, '.reveal-label').textContent = rs.presetName || t('targetTempoLabel');
  qs(screenEl, '[data-target-value]').textContent = formatTempo(rs.tempo);

}

function onTap(){
  var rs = roundState.tap;
  if (rs.finished) return;
  var ctx = ensureAudioContext();
  scheduleClick(ctx, ctx.currentTime, { accent: rs.times.length === 0 });

  var now = performance.now();
  rs.times.push(now);

  var screenEl = document.getElementById('screen-mode3');
  var tapBtn = qs(screenEl, '#btn-tap');
  tapBtn.classList.remove('tapped');
  void tapBtn.offsetWidth;
  tapBtn.classList.add('tapped');

  qs(screenEl, '[data-tap-count]').textContent = String(rs.times.length);

  if (rs.times.length >= 2){
    var last = rs.times.length - 1;
    var intervalMs = rs.times[last] - rs.times[last - 1];
    var bpm = 60000 / intervalMs;
    rs.tempos.push(bpm);
    rs.xTimes.push((rs.times[last] - rs.times[0]) / 1000);
  }

  if (rs.times.length >= 8){
    rs.finished = true;
    finishTapRound();
  }
}

function finishTapRound(){
  var rs = roundState.tap;
  var screenEl = document.getElementById('screen-mode3');

  });

/* ---- 妨害テンポの連続再生 (2拍ごとにランダムなテンポへ切り替わる) ---- */
function startObstructDistractor(targetTempo, pulseEl){
  stopObstructDistractor();
  var ctx = ensureAudioContext();
  var rs = roundState.obstruct;
  var perfNowAtStart = performance.now();
  obstructPlayback.active = true;
  obstructPlayback.ctxTime = ctx.currentTime + 0.02;
  obstructPlayback.ctxTimeRef = ctx.currentTime;
  obstructPlayback.elapsedAtRef = rs.times.length ? (perfNowAtStart - rs.times[0]) / 1000 : 0;
  obstructPlayback.pulseEl = pulseEl || null;
  obstructPlayback.currentTempo = pickDistractorTempo(targetTempo);
  obstructPlayback.beatsAtCurrentTempo = 0;
  rs.distractorSegments = [{ time: Math.max(0, obstructPlayback.elapsedAtRef), tempo: obstructPlayback.currentTempo }];
  scheduleObstructBatch(targetTempo);
}

function scheduleObstructBatch(targetTempo){
  if (!obstructPlayback.active) return;
  var ctx = state.audioCtx;
  var rs = roundState.obstruct;
  var nowCtx = ctx.currentTime;
  var batchSize = 4;
  for (var i = 0; i < batchSize; i++){
    if (obstructPlayback.beatsAtCurrentTempo >= 2){
      obstructPlayback.currentTempo = pickDistractorTempo(targetTempo);
      obstructPlayback.beatsAtCurrentTempo = 0;
      var elapsed = obstructPlayback.elapsedAtRef + (obstructPlayback.ctxTime - obstructPlayback.ctxTimeRef);
      rs.distractorSegments.push({ time: elapsed, tempo: obstructPlayback.currentTempo });
    }
    var tm = obstructPlayback.ctxTime;
    scheduleClick(ctx, tm, { accent: false });
    scheduleBeatEffects(tm, obstructPlayback.pulseEl);
    obstructPlayback.ctxTime += 60 / obstructPlayback.currentTempo;
    obstructPlayback.beatsAtCurrentTempo++;
  }
  var nextDelayMs = (obstructPlayback.ctxTime - nowCtx) * 1000 - 150;
  obstructPlayback.batchTimeoutId = setTimeout(function(){ scheduleObstructBatch(targetTempo); }, Math.max(50, nextDelayMs));
}

function stopObstructDistractor(){
  obstructPlayback.active = false;
  if (obstructPlayback.batchTimeoutId){ clearTimeout(obstructPlayback.batchTimeoutId); obstructPlayback.batchTimeoutId = null; }
  stopAllScheduledAudio();
}

/* 画面遷移時などに妨害モード関連のタイマー/再生を確実に止める */
function stopObstructAll(){
  var rs = roundState.obstruct;
  if (rs.countInTimeoutId){ clearTimeout(rs.countInTimeoutId); rs.countInTimeoutId = null; }
  stopObstructDistractor();
}

/* ==================================================================
   グラフ描画 (SVG) — 自力タップ・テンポキープ・妨害で共用
   ================================================================== */
function buildTempoGraphSVG(tapTempos, targetTempo, xTimes, distractorSegments){
  var width = 300, height = 176;
  var marginLeft = 34, marginRight = 14, marginTop = 16, marginBottom = 22;
  var plotW = width - marginLeft - marginRight;
  var plotH = height - marginTop - marginBottom;

  var allValues = tapTempos.concat([targetTempo]);
  var yMin = Math.min.apply(null, allValues);
  var yMax = Math.max.apply(null, allValues);
  var minRange = 20;
  if (yMax - yMin < minRange){
    var mid = (yMax + yMin) / 2;
    yMin = mid - minRange / 2;
    yMax = mid + minRange / 2;
  }
  var pad = (yMax - yMin) * 0.18;
  yMin = Math.max(0, yMin - pad);
  yMax = yMax + pad;

  var xMax = Math.max.apply(null, xTimes.concat([0.001]));

  function xScale(x){ return marginLeft + (x / xMax) * plotW; }
  function yScale(y){ return marginTop + plotH - ((y - yMin) / (yMax - yMin)) * plotH; }

  var targetY = yScale(targetTempo);

  var bandRects = '';
  var bandLabels = '';
  if (distractorSegments && distractorSegments.length){
    bandLabels += '<text x="2" y="' + (marginTop + 10) + '" class="graph-band-caption" text-anchor="start">' + t('graphDistractorLabel') + '</text>';
    var segs = distractorSegments.filter(function(s){ return s.time < xMax; });
    for (var bi = 0; bi < segs.length; bi++){
      var xStart = Math.max(0, segs[bi].time);
      var xEnd = bi + 1 < segs.length ? segs[bi + 1].time : xMax;
      if (xEnd <= xStart) continue;
      var rectX = xScale(xStart);
      var rectW = xScale(xEnd) - rectX;
      var bandClass = (bi % 2 === 0) ? 'graph-band-a' : 'graph-band-b';
      bandRects += '<rect x="' + rectX.toFixed(1) + '" y="' + marginTop + '" width="' + rectW.toFixed(1) + '" height="' + plotH + '" class="' + bandClass + '" />';
      var labelX = rectX + rectW / 2;
      bandLabels += '<text x="' + labelX.toFixed(1) + '" y="' + (marginTop + 10) + '" class="graph-band-label" text-anchor="middle">' + segs[bi].tempo + '</text>';
    }
  }

  var pathD = '';
  tapTempos.forEach(function(v, i){
    var x = xScale(xTimes[i]);
    var y = yScale(v);
    pathD += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  });

  var circles = tapTempos.map(function(v, i){
    var x = xScale(xTimes[i]);
    var y = yScale(v);
    return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" class="graph-point" />';
  }).join('');

  var pointLabels = tapTempos.map(function(v, i){
    var x = xScale(xTimes[i]);
    var y = yScale(v);
    var preferAbove = (i % 2 === 0);
    var labelY = preferAbove ? y - 9 : y + 15;
    if (labelY < marginTop + 7) labelY = y + 15;
    if (labelY > height - marginBottom + 4) labelY = y - 9;
    return '<text x="' + x.toFixed(1) + '" y="' + labelY.toFixed(1) + '" class="graph-point-label" text-anchor="middle">' + Math.round(v) + '</text>';
  }).join('');

  var yTicks = [yMin, (yMin + yMax) / 2, yMax];
  var yTickLabels = yTicks.map(function(v){
    var y = yScale(v);
    return '<text x="' + (marginLeft - 6) + '" y="' + (y + 3).toFixed(1) + '" class="graph-axis-label" text-anchor="end">' + Math.round(v) + '</text>';
  }).join('');

  var gridLines = yTicks.map(function(v){
    var y = yScale(v);
    return '<line x1="' + marginLeft + '" y1="' + y.toFixed(1) + '" x2="' + (width - marginRight) + '" y2="' + y.toFixed(1) + '" class="graph-grid" />';
  }).join('');

  var targetLabelX = width - marginRight;
  var targetLabelY = targetY - 6 < marginTop + 8 ? targetY + 12 : targetY - 6;

  return '<svg viewBox="0 0 ' + width + ' ' + height + '" class="tempo-graph" role="img">' +
    bandRects +
    gridLines +
    '<line x1="' + marginLeft + '" y1="' + targetY.toFixed(1) + '" x2="' + (width - marginRight) + '" y2="' + targetY.toFixed(1) + '" class="graph-target-line" />' +
    '<text x="' + targetLabelX + '" y="' + targetLabelY.toFixed(1) + '" class="graph-target-label" text-anchor="end">' + '\u2669=' + targetTempo + '</text>' +
    '<path d="' + pathD.trim() + '" class="graph-line" fill="none" />' +
    circles +
    pointLabels +
    yTickLabels +
    bandLabels +
    '</svg>';
}

  state.history.push(entry);

}
