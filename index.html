  }
  var icon = entry.subMode === 'survival' ? '\u2764' : (entry.subMode === 'challenge60' ? '\u23f1' : '\u2669');
  var modeLabel = t(modeLabelKey(entry.type)) + ' \u00b7 ' + t(subModeLabelKey(entry.subMode));
  var stats = getEntryStats(entry);
  return '<div class="result-mark tap-icon">' + icon + '</div>' +
    '<div class="row-main">' +
      '<div class="row-mode">' + modeLabel + ' \u00b7 ' + formatDateTime(entry.timestamp) + '</div>' +
      '<div class="row-values">' + buildJudgmentSummaryHtml(stats) + '</div>' +
    '</div>';
}

function renderHistoryList(){
  var listEl = document.getElementById('screen-history').querySelector('[data-history-list]');
  var filtered = state.history.filter(function(h){
    return historyFilter === 'all' ? true : h.type === historyFilter;
  });
  var sorted = filtered.slice().reverse();

  if (sorted.length === 0){
    listEl.innerHTML = '<div class="history-empty">' + t('historyEmpty') + '</div>';
    return;
  }

  listEl.innerHTML = '';
  sorted.forEach(function(entry){
    var row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = buildHistoryRowPreviewHtml(entry) +
      '<button class="btn-delete-entry" type="button" aria-label="delete">\ud83d\uddd1</button>' +
      '<button class="btn-detail" type="button">' + t('detailBtn') + '</button>';
    row.querySelector('.btn-detail').addEventListener('click', function(){ openDetailModal(entry); });
    row.querySelector('.btn-delete-entry').addEventListener('click', function(){ confirmDeleteHistoryEntry(entry); });
    listEl.appendChild(row);
  });
}

function confirmDeleteHistoryEntry(entry){
  var detailHtml = '<div class="history-row-preview">' + buildHistoryRowPreviewHtml(entry) + '</div>';
  showConfirmModal('confirmDeleteEntry', function(){
    state.history = state.history.filter(function(h){ return h.id !== entry.id; });
    saveHistoryToStorage();
    renderHistoryList();
  }, detailHtml);
}

function openDetailModal(entry){
  if (entry.type === 'tap' || entry.type === 'tempokeep' || entry.type === 'obstruct'){
    openGraphDetailModal(entry);
  } else {
    openSessionDetailModal(entry);
  }
}

function openGraphDetailModal(entry){
  var backdrop = document.getElementById('modal-backdrop');
  var summary = qs(backdrop, '[data-modal-summary]');
  summary.innerHTML =
    '<div class="stat"><span class="lbl">' + t('avgTempoLabel') + '</span><span class="val">' + formatTempo(Math.round(entry.avgTempo)) + '</span></div>' +
    '<div class="stat"><span class="lbl">' + t('targetTempoLabel') + '</span><span class="val">' + formatTempo(entry.targetTempo) + '</span></div>';
  var graphHtml = buildTempoGraphSVG(entry.tapTempos, entry.targetTempo, entry.xTimes, entry.distractorSegments);
  qs(backdrop, '[data-modal-graph]').innerHTML = graphHtml;
  backdrop.classList.add('show');
}

function openSessionDetailModal(entry){
  var backdrop = document.getElementById('modal-backdrop');
  var summary = qs(backdrop, '[data-modal-summary]');
  var stats = getEntryStats(entry);
  summary.innerHTML = '<div class="modal-judgment-summary">' + buildJudgmentSummaryHtml(stats) + '</div>';

  var listHtml = '<div class="detail-log-list">';
  var qNum = 0;
  entry.details.forEach(function(d){
    if (d.kind === 'lifegain'){
      listHtml += '<div class="detail-log-row lifegain-row">' +
        '<span class="log-mark">\u2764+1</span>' +
        '<span class="log-values">' + t('lifeCountLabel') + ' ' + d.livesAfter + '</span>' +
        '</div>';
    } else {
      qNum++;
      var j = d.judgment || (d.correct === true ? 'correct' : 'wrong');
      var mark = j === 'correct' ? '\u25cb' : (j === 'near' ? '\u25b3' : '\u2715');
      var markClass = j === 'correct' ? 'correct' : (j === 'near' ? 'near' : 'incorrect');
      var valuesHtml = formatTempo(d.targetTempo);
      if (j !== 'correct') valuesHtml += '<span class="wrong-val">(' + d.userTempo + ')</span>';
      var extra = '';
      if (entry.subMode === 'survival' && d.livesAfter !== undefined){
        extra = '<span class="log-extra">' + t('lifeCountLabel') + ' ' + d.livesAfter + '</span>';
      } else if (entry.subMode === 'challenge60' && d.timeRemainingMs !== undefined){
        extra = '<span class="log-extra">' + t('remainingLabel') + ' ' + (d.timeRemainingMs / 1000).toFixed(1) + t('secondsUnit') + '</span>';
      }
      listHtml += '<div class="detail-log-row">' +
        '<span class="log-num">' + qNum + '</span>' +
        '<span class="log-mark ' + markClass + '">' + mark + '</span>' +
        '<span class="log-values">' + valuesHtml + '</span>' +
        extra +
        '</div>';
    }
  });
  listHtml += '</div>';
  qs(backdrop, '[data-modal-graph]').innerHTML = listHtml;
  backdrop.classList.add('show');
}

function closeDetailModal(){
  document.getElementById('modal-backdrop').classList.remove('show');
  qs(document.getElementById('modal-backdrop'), '.modal-title').setAttribute('data-i18n', 'modalDetailTitle');
}

/* 既存の詳細モーダルをPWAインストール案内などの汎用情報表示にも使い回す */
function openInfoModal(titleKey, bodyHtml){
  var backdrop = document.getElementById('modal-backdrop');
  var titleEl = qs(backdrop, '.modal-title');
  titleEl.setAttribute('data-i18n', titleKey);
  titleEl.textContent = t(titleKey);
  qs(backdrop, '[data-modal-summary]').innerHTML = '';
  qs(backdrop, '[data-modal-graph]').innerHTML = bodyHtml;
  backdrop.classList.add('show');
}

/* ==================================================================
   確認モーダル (履歴消去などの破壊的操作用)
   ================================================================== */
var pendingConfirmAction = null;

function showConfirmModal(messageKey, onConfirm, detailHtml){
  var backdrop = document.getElementById('confirm-backdrop');
  qs(backdrop, '[data-confirm-message]').textContent = t(messageKey);
  var detailEl = qs(backdrop, '[data-confirm-detail]');
  detailEl.innerHTML = detailHtml || '';
  detailEl.style.display = detailHtml ? 'flex' : 'none';
  pendingConfirmAction = onConfirm;
  backdrop.classList.add('show');
}

function closeConfirmModal(){
  document.getElementById('confirm-backdrop').classList.remove('show');
  pendingConfirmAction = null;
}

/* ==================================================================
   設定
   ================================================================== */
function renderSettingsUI(){
  var screenEl = document.getElementById('screen-settings');
  qs(screenEl, '#range-volume').value = state.settings.clickVolume;
  setSegActive(screenEl, 'clickSound', state.settings.clickSound);
  setSegActive(screenEl, 'theme', state.settings.theme);
  setSegActive(screenEl, 'difficulty', state.settings.difficulty);
  renderTestPlayButton(qs(screenEl, '#btn-test-play'));
  qsa(screenEl, '[data-setting-checkbox]').forEach(function(cb){
    var key = cb.getAttribute('data-setting-checkbox');
    cb.checked = !!state.settings[key];
  });
  var editTempoListBtn = qs(screenEl, '#btn-edit-tempolist');
  if (editTempoListBtn) editTempoListBtn.textContent = t('btnEditTempoList') + ' (' + TEMPO_LIST.length + ')';
}

function setSegActive(root, segName, value){
  var seg = root.querySelector('[data-seg="' + segName + '"]');
  if (!seg) return;
  qsa(seg, 'button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-value') === value);
  });
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.settings.theme);
}

function renderSubModeSelector(){
  qsa(document, '[data-submode-selector] button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-submode-value') === state.listenSubMode);
  });
}

/* ==================================================================
   お題テンポリスト編集モーダル
   ================================================================== */
function renderTempoListModal(){
  var backdrop = document.getElementById('tempolist-backdrop');
  var listEl = qs(backdrop, '[data-tempolist-items]');
  listEl.innerHTML = '';
  TEMPO_LIST.forEach(function(v){
    var row = document.createElement('div');
    row.className = 'tempolist-item';
    row.innerHTML = '<span class="tempolist-value">' + v + '</span>' +
      '<button class="btn-tempolist-remove" type="button" data-value="' + v + '" aria-label="remove">\ud83d\uddd1</button>';
    listEl.appendChild(row);
  });
  qsa(listEl, '.btn-tempolist-remove').forEach(function(btn){
    btn.disabled = TEMPO_LIST.length <= MIN_TEMPO_LIST_LENGTH;
    btn.addEventListener('click', function(){
      var v = parseInt(this.getAttribute('data-value'), 10);
      var res = removeCustomTempo(v);
      if (res.ok){
        qs(backdrop, '[data-tempolist-error]').textContent = '';
        renderTempoListModal();
        renderSettingsUI();
      }
    });
  });
}

function openTempoListModal(){
  qs(document.getElementById('tempolist-backdrop'), '[data-tempolist-error]').textContent = '';
  document.getElementById('input-tempolist-new').value = '';
  renderTempoListModal();
  document.getElementById('tempolist-backdrop').classList.add('show');
}

function closeTempoListModal(){
  document.getElementById('tempolist-backdrop').classList.remove('show');
}

/* ==================================================================
   イベント初期化
   ================================================================== */
function initEvents(){
  document.getElementById('btn-lang').addEventListener('click', function(){
    state.lang = state.lang === 'ja' ? 'en' : 'ja';
    applyI18n();
    refreshDynamicForScreen();
  });

  qsa(document, '[data-nav]').forEach(function(el){
    el.addEventListener('click', function(){
      showScreen(this.getAttribute('data-nav'));
    });
  });

  qsa(document, '[data-submode-selector] button').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.listenSubMode = this.getAttribute('data-submode-value');
      renderSubModeSelector();
    });
  });

  qsa(document, '.screen').forEach(function(screenEl){
    screenEl.addEventListener('click', function(evt){
      var actionEl = evt.target.closest ? evt.target.closest('[data-action]') : null;
      if (!actionEl) return;
      var action = actionEl.getAttribute('data-action');
      var modeType = screenEl.getAttribute('data-mode');

      if (action === 'back-top'){ showScreen('top'); return; }

      if (action === 'reroll'){
        if (modeType === 'select' || modeType === 'input'){ rerollRound(modeType); }
        else if (modeType === 'tap'){ rerollTap(); }
        else if (modeType === 'tempokeep'){ rerollTempoKeep(); }
        else if (modeType === 'obstruct'){ rerollObstruct(); }
        return;
      }
      if (action === 'open-presets'){
        openPresetsModal(modeType);
        return;
      }
      if (action === 'next'){
        if (modeType === 'select' || modeType === 'input'){
          roundState[modeType].questionNumber++;
          startRound(modeType);
        }
        else if (modeType === 'tap'){ startTapRound(); }
        else if (modeType === 'tempokeep'){ startTempoKeepRound(); }
        else if (modeType === 'obstruct'){ startObstructRound(); }
        return;
      }
      if (action === 'play'){
        var rsType = modeType === 'select' ? 'select' : 'input';
        playTempoPreview(roundState[rsType].tempo, screenEl);
        return;
      }
      if (action === 'answer'){ onInputAnswer(); return; }
      if (action === 'retry-tap'){
        resetTapAttempt();
        renderTapScreen();
        return;
      }
      if (action === 'start-challenge'){
        if (modeType === 'select' || modeType === 'input'){ startChallenge60(modeType); }
        return;
      }
      if (action === 'retry-session'){
        if (modeType === 'select' || modeType === 'input'){
          stopAllScheduledAudio();
          startNewSession(modeType, state.listenSubMode);
          roundState[modeType].questionNumber = 1;
          if (state.listenSubMode === 'challenge60'){
            roundState[modeType].uiState = 'prestart';
            renderModeScreen(modeType);
          } else if (state.listenSubMode === 'survival'){
            roundState[modeType].lives = 3;
            roundState[modeType].streak = 0;
            startRound(modeType);
          }
        }
        return;
      }
      if (action === 'retry-tempokeep'){
        stopAllScheduledAudio();
        var rs = roundState.tempokeep;
        if (rs.resultCooldownTimeoutId){ clearTimeout(rs.resultCooldownTimeoutId); rs.resultCooldownTimeoutId = null; }
        rs.phase = 'idle';
        rs.times = []; rs.tempos = []; rs.xTimes = [];
        renderTempoKeepScreen();
        return;
      }
      if (action === 'retry-obstruct'){
        stopObstructAll();
        var rsOb = roundState.obstruct;
        if (rsOb.resultCooldownTimeoutId){ clearTimeout(rsOb.resultCooldownTimeoutId); rsOb.resultCooldownTimeoutId = null; }
        rsOb.phase = 'idle';
        rsOb.times = []; rsOb.tempos = []; rsOb.xTimes = []; rsOb.distractorSegments = [];
        renderObstructScreen();
        return;
      }
      if (action === 'clear-history'){
        showConfirmModal('confirmClearHistory', function(){
          state.history = [];
          saveHistoryToStorage();
          renderHistoryList();
        });
        return;
      }
      if (action === 'test-play'){ toggleTestPlay(); return; }
    });
  });

  var inputTempo = document.getElementById('input-tempo');
  inputTempo.addEventListener('input', function(){
    var screenEl = document.getElementById('screen-mode2');
    var answerBtn = qs(screenEl, '.btn-answer');
    var val = this.value.trim();
    answerBtn.disabled = (val === '' || isNaN(parseInt(val, 10)));
  });
  inputTempo.addEventListener('keydown', function(evt){
    if (evt.key === 'Enter'){
      var screenEl = document.getElementById('screen-mode2');
      var answerBtn = qs(screenEl, '.btn-answer');
      if (!answerBtn.disabled) onInputAnswer();
    }
  });

  var inputMeasures = document.getElementById('input-measures');
  inputMeasures.addEventListener('input', function(){
    var v = parseInt(this.value, 10);
    if (!isNaN(v) && v >= 1){
      roundState.tempokeep.measures = Math.min(16, v);
    }
  });
  bindScrollSwipe(inputMeasures, function(){ adjustMeasures('tempokeep', 1); }, function(){ adjustMeasures('tempokeep', -1); }, 2);

  document.getElementById('toggle-tk-tapsound').addEventListener('change', function(){
    roundState.tempokeep.tapSound = this.checked;
  });

  var inputMeasuresObstruct = document.getElementById('input-measures-obstruct');
  inputMeasuresObstruct.addEventListener('input', function(){
    var v = parseInt(this.value, 10);
    if (!isNaN(v) && v >= 1){
      roundState.obstruct.measures = Math.min(16, v);
    }
  });
  bindScrollSwipe(inputMeasuresObstruct, function(){ adjustMeasures('obstruct', 1); }, function(){ adjustMeasures('obstruct', -1); }, 2);

  document.getElementById('toggle-obstruct-tapsound').addEventListener('change', function(){
    roundState.obstruct.tapSound = this.checked;
  });

  /* タップ判定は「指が触れた瞬間」で計測したいので、click(=離した時)ではなくpointerdownを使う */
  document.getElementById('btn-tap').addEventListener('pointerdown', function(evt){
    evt.preventDefault();
    onTap();
  });
  document.getElementById('btn-tempokeep-action').addEventListener('pointerdown', function(evt){
    onTempoKeepActionPress(evt);
  });
  document.getElementById('btn-obstruct-action').addEventListener('pointerdown', function(evt){
    onObstructActionPress(evt);
  });

  enableTargetTapEdit('screen-mode3', '.big-num', 'tap');
  enableTargetTapEdit('screen-mode4', '.big-num', 'tempokeep');
  enableTargetTapEdit('screen-mode5', '.big-num', 'obstruct');

  qsa(document, '[data-history-filters] .filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      historyFilter = this.getAttribute('data-filter');
      qsa(document, '[data-history-filters] .filter-btn').forEach(function(b){
        b.classList.toggle('active', b === btn);
      });
      renderHistoryList();
    });
  });

  document.getElementById('range-volume').addEventListener('input', function(){
    state.settings.clickVolume = parseFloat(this.value);
    saveSettingsToStorage();
  });

  qsa(document, '[data-seg]').forEach(function(seg){
    var segName = seg.getAttribute('data-seg');
    qsa(seg, 'button').forEach(function(btn){
      btn.addEventListener('click', function(){
        var value = this.getAttribute('data-value');
        state.settings[segName] = value;
        setSegActive(document.getElementById('screen-settings'), segName, value);
        if (segName === 'theme') applyTheme();
        saveSettingsToStorage();
      });
    });
  });

  qsa(document, '[data-setting-checkbox]').forEach(function(cb){
    cb.addEventListener('change', function(){
      var key = this.getAttribute('data-setting-checkbox');
      state.settings[key] = this.checked;
      saveSettingsToStorage();
    });
  });

  document.getElementById('btn-modal-close').addEventListener('click', closeDetailModal);
  document.getElementById('modal-backdrop').addEventListener('click', function(evt){
    if (evt.target === this) closeDetailModal();
  });

  document.getElementById('btn-confirm-cancel').addEventListener('click', closeConfirmModal);
  document.getElementById('btn-confirm-ok').addEventListener('click', function(){
    var action = pendingConfirmAction;
    closeConfirmModal();
    if (action) action();
  });
  document.getElementById('confirm-backdrop').addEventListener('click', function(evt){
    if (evt.target === this) closeConfirmModal();
  });

  document.getElementById('btn-edit-tempolist').addEventListener('click', openTempoListModal);
  document.getElementById('btn-tempolist-close').addEventListener('click', closeTempoListModal);
  document.getElementById('tempolist-backdrop').addEventListener('click', function(evt){
    if (evt.target === this) closeTempoListModal();
  });
  document.getElementById('btn-tempolist-add').addEventListener('click', function(){
    var input = document.getElementById('input-tempolist-new');
    var errEl = qs(document.getElementById('tempolist-backdrop'), '[data-tempolist-error]');
    var value = parseInt(input.value, 10);
    var res = addCustomTempo(value);
    if (res.ok){
      input.value = '';
      errEl.textContent = '';
      renderTempoListModal();
      renderSettingsUI();
    } else {
      errEl.textContent = res.reason === 'dup' ? t('tempoListErrDup') : t('tempoListErrRange');
    }
  });
  document.getElementById('input-tempolist-new').addEventListener('keydown', function(evt){
    if (evt.key === 'Enter') document.getElementById('btn-tempolist-add').click();
  });
  document.getElementById('btn-tempolist-reset').addEventListener('click', function(){
    showConfirmModal('confirmResetTempoList', function(){
      resetTempoListToDefault();
      renderTempoListModal();
      renderSettingsUI();
    });
  });

  document.getElementById('btn-presets-close').addEventListener('click', closePresetsModal);
  document.getElementById('presets-backdrop').addEventListener('click', function(evt){
    if (evt.target === this) closePresetsModal();
  });

  document.getElementById('btn-preset-save').addEventListener('click', function(){
    var nameInput = document.getElementById('input-preset-name');
    var tempoInput = document.getElementById('input-preset-tempo');
    var errEl = qs(document.getElementById('presets-backdrop'), '[data-presets-error]');
    var tempo = parseInt(tempoInput.value, 10);
    var res = addPreset(nameInput.value, tempo);
    if (res.ok){
      nameInput.value = '';
      errEl.textContent = '';
      renderPresetsList();
    } else {
      errEl.textContent = res.reason === 'name' ? t('presetErrName') : t('tempoListErrRange');
    }
  });
  document.getElementById('input-preset-name').addEventListener('keydown', function(evt){
    if (evt.key === 'Enter') document.getElementById('btn-preset-save').click();
  });

  document.getElementById('input-preset-search').addEventListener('input', function(){
    presetsModalState.query = this.value;
    updatePresetSearchClearButton();
    renderPresetsList();
  });
  document.getElementById('btn-preset-search-clear').addEventListener('click', function(){
    var input = document.getElementById('input-preset-search');
    input.value = '';
    presetsModalState.query = '';
    updatePresetSearchClearButton();
    renderPresetsList();
    input.focus();
  });

  qsa(document, '.btn-preset-sort').forEach(function(btn){
    btn.addEventListener('click', function(){
      var key = this.getAttribute('data-sort');
      if (presetsModalState.sortKey !== key){
        presetsModalState.sortKey = key;
        presetsModalState.sortDir = 'asc';
      } else if (presetsModalState.sortDir === 'asc'){
        presetsModalState.sortDir = 'desc';
      } else {
        presetsModalState.sortKey = null; /* 3回目でソート解除、並べ替え可能な状態に戻す */
        presetsModalState.sortDir = 'asc';
      }
      renderPresetSortButtons();
      renderPresetsList();
    });
  });

  window.addEventListener('beforeinstallprompt', function(evt){
    evt.preventDefault();
    deferredInstallPrompt = evt;
    updateInstallButtonVisibility();
  });
  window.addEventListener('appinstalled', function(){
    deferredInstallPrompt = null;
    isStandaloneDisplay = true;
    updateInstallButtonVisibility();
  });
  document.getElementById('btn-pwa-install').addEventListener('click', function(){
    if (isStandaloneDisplay){
      openInfoModal('pwaAlreadyInstalledTitle', '<p>' + t('pwaAlreadyInstalledBody') + '</p>');
      return;
    }
    if (deferredInstallPrompt){
      var promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;
      promptEvent.prompt();
      promptEvent.userChoice.then(function(choice){
        if (choice.outcome === 'accepted') updateInstallButtonVisibility();
      });
      return;
    }
    if (isIOSDevice){
      openInfoModal('pwaIosInstallTitle', t('pwaIosInstallBody'));
      return;
    }
    openInfoModal('pwaGenericInstallTitle', t('pwaGenericInstallBody'));
  });
}

function updateInstallButtonVisibility(){
  var btn = document.getElementById('btn-pwa-install');
  if (!btn) return;
  btn.style.display = isStandaloneDisplay ? 'none' : '';
}

/* prefers-reduced-motionが有効な環境では振り子アニメーションを止める(SMILはCSSのanimation-play-stateでは制御できないため要素ごと除去する) */
/* 振り子アニメーション: CSSアニメーション/SMILに頼らず、rAFでtransform属性を毎フレーム直接書き換える。
   端末やブラウザのアニメーションエンジンの差異(Android環境で描画されない問題)を回避するための方式 */
/* 振り子アニメーション: SVGを使わず、素のHTML div + CSS transform(rotate)をJSで毎フレーム直接書き換える。
   SVG特有の座標系/描画エンジンの差異を根本的に避けるための構成。
   これまでprefers-reduced-motionが真の場合にアニメーションを止める処理を入れていたが、
   端末側の設定次第で意図せず該当し、これが今までの修正が効かなかった原因である可能性があるため、
   ここでは判定を行わず常にアニメーションさせる */
function initPendulumMotion(){
  var armEl = document.querySelector('.pendulum-arm');
  if (!armEl) return;

  var maxAngle = 18;
  var periodMs = 4000; /* -18度→+18度→-18度の1往復にかかる時間 */
  var startTs = null;
  var rafId = null;

  function frame(ts){
    if (startTs === null) startTs = ts;
    var angle = maxAngle * Math.sin((2 * Math.PI * (ts - startTs)) / periodMs);
    armEl.style.transform = 'translateX(-50%) rotate(' + angle.toFixed(2) + 'deg)';
    rafId = requestAnimationFrame(frame);
  }

  function start(){
    if (rafId === null){
      startTs = null;
      rafId = requestAnimationFrame(frame);
    }
  }
  function stop(){
    if (rafId !== null){
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  /* タブが非表示の間は止めてバッテリーを節約し、復帰時に再開する */
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stop(); else start();
  });

  start();
}

/* ==================================================================
   初期化
   ================================================================== */
function init(){
  loadTempoListFromStorage();
  loadPresetsFromStorage();
  loadSettingsFromStorage();
  loadHistoryFromStorage();
  applyI18n();
  applyTheme();
  renderSubModeSelector();
  updateInstallButtonVisibility();
  try { initPendulumMotion(); } catch (e){ console.warn('pendulum init failed:', e); }
  initEvents();
}

document.addEventListener('DOMContentLoaded', init);

/* Service Worker登録 (./sw.js が同じ場所に無い場合は静かに失敗するだけで、アプリ自体は通常通り動作する) */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(e){
      console.warn('SW registration failed:', e);
    });
  });
}
